name: CI

on:
  push:
    branches: [main, v1]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (no model backends; tests use a mocked LLM)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Samples are reproducible
        run: |
          python scripts/make_samples.py
          git diff --exit-code -- samples/
      - name: Tests
        run: pytest -q
      - name: CLI smoke test
        run: |
          table-qa --version
          table-qa profile samples/sales.xlsx
          # api backend pointed at a closed port must fail with a clear message (exit 2)
          MS_BACKEND=api MS_API_BASE=http://127.0.0.1:9/v1 MS_MODEL=none \
            table-qa ask samples/sales.csv "What is the total revenue?" || test $? -eq 2
