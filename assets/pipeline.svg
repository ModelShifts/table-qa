<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="t d">
  <title id="t">How table-qa works</title>
  <desc id="d">A spreadsheet is profiled. A model writes pandas code for a plain-language question. The code runs in a sandbox. You get the computed value, a chart when one helps, and the steps — including the code — that produced them.</desc>
  <style>
    .bg{fill:#faf7f0}
    .card{fill:#ffffff;stroke:#1c1915;stroke-width:1.5}
    .hot{fill:#ffffff;stroke:#7c3420;stroke-width:2}
    .k{font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.12em;fill:#7c3420}
    .h{font:500 23px Georgia,'Times New Roman',serif;fill:#1c1915;letter-spacing:-.01em}
    .s{font:14px Georgia,'Times New Roman',serif;fill:#4e4942}
    .m{font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#1c1915}
    .wire{fill:none;stroke:#1c1915;stroke-width:1.5}
    .flow{fill:none;stroke:#7c3420;stroke-width:3;stroke-linecap:round;stroke-dasharray:14 600;stroke-dashoffset:614}
    .branch{fill:none;stroke:#1c1915;stroke-width:1.5;stroke-dasharray:5 5}
    .tag{fill:#f3efe4;stroke:#d3cbb8}
    @media (prefers-reduced-motion:no-preference){
      .flow{animation:run 4.8s cubic-bezier(.55,.1,.35,1) infinite}
      .f2{animation-delay:1.2s}.f3{animation-delay:2.4s}.f4{animation-delay:3.6s}
      .pulse{animation:pulse 4.8s ease-in-out infinite}
    }
    @keyframes run{0%{stroke-dashoffset:614}35%{stroke-dashoffset:0}100%{stroke-dashoffset:0}}
    @keyframes pulse{0%,70%,100%{stroke-width:2}82%{stroke-width:4}}
</style>
  <rect class="bg" x="0" y="0" width="1200" height="420" rx="18"/>
  <text class="k" x="40" y="48">PIPELINE · ONE COMMAND, FIVE STEPS</text>
  <path class="wire" d="M222 160H252"/><path class="flow" d="M222 160H252"/><path d="M246 154l8 6-8 6" fill="none" stroke="#1c1915" stroke-width="1.5"/><path class="wire" d="M450 160H480"/><path class="flow f2" d="M450 160H480"/><path d="M474 154l8 6-8 6" fill="none" stroke="#1c1915" stroke-width="1.5"/><path class="wire" d="M680 160H710"/><path class="flow f3" d="M680 160H710"/><path d="M704 154l8 6-8 6" fill="none" stroke="#1c1915" stroke-width="1.5"/><path class="wire" d="M908 160H938"/><path class="flow f4" d="M908 160H938"/><path d="M932 154l8 6-8 6" fill="none" stroke="#1c1915" stroke-width="1.5"/>
    <g transform="translate(40 80)">
    <rect class="card" width="182" height="160" rx="10"/>
    <g transform="translate(20 24)" fill="none" stroke="#1c1915" stroke-width="1.3">
      <rect x="0" y="0" width="52" height="48" rx="2"/>
      <path d="M0 14h52M14 0v48" stroke="#7c3420"/>
    </g>
    <text class="k" x="20" y="98">01 INPUT</text>
    <text class="h" x="20" y="126">Excel or CSV</text>
    <text class="s" x="20" y="148">sheets detected</text>
  </g>  <g transform="translate(254 80)">
    <rect class="card" width="196" height="160" rx="10"/>
    <g transform="translate(20 24)">
      <text class="m" x="0" y="14">region   string</text>
      <text class="m" x="0" y="32">revenue  number</text>
      <text class="m" x="0" y="50" fill="#4e4942">order_date  date</text>
    </g>
    <text class="k" x="20" y="98">02 PROFILE</text>
    <text class="h" x="20" y="126">Headers + types</text>
    <text class="s" x="20" y="148">columns and samples</text>
  </g>  <g transform="translate(482 80)">
    <rect class="card" width="198" height="160" rx="10"/>
    <g transform="translate(20 24)">
      <text class="m" x="0" y="14" fill="#4e4942">growth = (curr-</text>
      <text class="m" x="0" y="32">prior)/prior</text>
      <text class="m" x="0" y="50" fill="#7c3420">answer = idxmax()</text>
    </g>
    <text class="k" x="20" y="98">03 PLAN</text>
    <text class="h" x="20" y="126">Question → code</text>
    <text class="s" x="20" y="148">pandas, one reading</text>
  </g>  <g transform="translate(712 80)">
    <rect class="card" width="196" height="160" rx="10"/>
    <g transform="translate(20 28)" fill="none" stroke="#1c1915" stroke-width="1.3">
      <rect x="0" y="0" width="48" height="48" rx="4"/>
      <path d="M14 24h20" stroke="#7c3420"/><path d="M28 18l6 6-6 6" stroke="#7c3420"/>
    </g>
    <text class="k" x="20" y="98">04 RUN</text>
    <text class="h" x="20" y="126">In a sandbox</text>
    <text class="s" x="20" y="148">original file untouched</text>
  </g>  <g transform="translate(940 80)">
    <rect class="hot pulse" width="220" height="160" rx="10"/>
    <g transform="translate(20 24)">
      <text class="m" x="0" y="14">answer: "East"</text>
      <text class="m" x="0" y="34" fill="#7c3420">chart: bar · region</text>
      <text class="m" x="0" y="50" fill="#4e4942">steps + analysis.py</text>
    </g>
    <text class="k" x="20" y="98">05 OUTPUT</text>
    <text class="h" x="20" y="126">Answer + chart</text>
    <text class="s" x="20" y="148">and the steps, as code</text>
  </g>
  
  <text class="s" x="40" y="392">Backend: your OpenAI-compatible API, or open models from Hugging Face (Qwen2.5-Coder). Same pipeline either way.</text>
</svg>
